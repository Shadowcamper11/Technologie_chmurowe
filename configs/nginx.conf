user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=stats_cache:10m max_size=100m inactive=1h use_temp_path=off;
  client_body_temp_path /tmp/nginx-client-temp;
  proxy_temp_path /tmp/nginx-proxy-temp;

  upstream backend_pool {
    server backend_1:5000;
    server backend_2:5001;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/stats {
      proxy_cache stats_cache;
      proxy_cache_key "$scheme$proxy_host$request_uri";
      proxy_cache_methods GET;
      proxy_cache_valid 200 30s;
      proxy_cache_bypass $http_cache_control;
      proxy_no_cache $http_cache_control;

      add_header X-Cache-Status $upstream_cache_status always;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Upstream-Address $upstream_addr always;
      add_header X-Upstream-Status $upstream_status always;
      add_header X-Backend-Instance $upstream_http_x_backend_instance always;

      proxy_pass http://backend_pool/stats;
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Upstream-Address $upstream_addr always;
      add_header X-Upstream-Status $upstream_status always;
      add_header X-Backend-Instance $upstream_http_x_backend_instance always;

      proxy_pass http://backend_pool/;
    }

    location / {
      try_files $uri $uri.html $uri/ /index.html;
    }
  }
}
