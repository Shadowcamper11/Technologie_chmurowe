services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started
    ports:
      - "80:8080"
    networks:
      - proxy-net
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf

  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BACKEND_PORT: ${BACKEND_PORT}
      INSTANCE_ID: api-1
      TASK_QUEUE_NAME: jobs:items
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BACKEND_PORT: ${BACKEND_PORT_2}
      INSTANCE_ID: api-2
      TASK_QUEUE_NAME: jobs:items
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      INSTANCE_ID: worker-1
      TASK_QUEUE_NAME: jobs:items
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL}
    secrets:
      - db_user
      - db_password
    networks:
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - db_user
      - db_password
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_user)\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
  db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  postgres-data:
  redis-data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

configs:
  nginx_config:
    file: ./configs/nginx.conf
  app_config:
    file: ./backend/app.config.json
