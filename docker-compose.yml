services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: technologie_chmurowe-nginx:${APP_VERSION:-latest}
    depends_on:
      backend_1:
        condition: service_started
      backend_2:
        condition: service_started
    networks:
      - proxy-net
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf

  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: technologie_chmurowe-backend_1:${APP_VERSION:-latest}
    env_file:
      - path: ./.env.common
        required: true
      - path: ./.env.local
        required: false
    environment:
      BACKEND_PORT: ${BACKEND_PORT:?Ustaw BACKEND_PORT w .env.common}
      INSTANCE_ID: api-1
      TASK_QUEUE_NAME: jobs:items
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    labels:
      - app.log_level=${LOG_LEVEL:-info}
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: technologie_chmurowe-backend_2:${APP_VERSION:-latest}
    env_file:
      - path: ./.env.common
        required: true
      - path: ./.env.local
        required: false
    environment:
      BACKEND_PORT: ${BACKEND_PORT_2:?Ustaw BACKEND_PORT_2 w .env.common}
      INSTANCE_ID: api-2
      TASK_QUEUE_NAME: jobs:items
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    labels:
      - app.log_level=${LOG_LEVEL:-info}
    secrets:
      - db_user
      - db_password
    configs:
      - source: app_config
        target: /app/app.config.json
    networks:
      - proxy-net
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: technologie_chmurowe-worker:${APP_VERSION:-latest}
    env_file:
      - path: ./.env.common
        required: true
      - path: ./.env.local
        required: false
    environment:
      INSTANCE_ID: worker-1
      TASK_QUEUE_NAME: jobs:items
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    labels:
      - app.log_level=${LOG_LEVEL:-info}
    secrets:
      - db_user
      - db_password
    networks:
      - app-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - db_user
      - db_password
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/db_user)\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    profiles: ["debug"]
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    profiles: ["debug"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

  db-migrator:
    image: alpine:3.20
    profiles: ["migrate"]
    restart: "no"
    command: ["sh", "-c", "echo migration done"]
    networks:
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
  db-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  postgres-data:
  redis-data:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt

configs:
  nginx_config:
    file: ./configs/nginx.conf
  app_config:
    file: ./backend/app.config.json
